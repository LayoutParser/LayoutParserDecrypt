name: LayoutParserDecrypt - Build

# Actions pinadas por SHA completo (com tag em comentário) — hardening de supply-chain,
# mesmo padrão adotado em layoutparser-portal e replicado aqui por paridade
# (ver .claude/agent-memory/lp-devops para o pedido original). Uma tag mutável (@v4) pode ser
# recriada apontando pra outro commit; o SHA não.

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

# Evita empilhar builds duplicados quando o mesmo branch/PR recebe pushes em sequência.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0

      - name: Restore (NuGet)
        shell: pwsh
        run: |
          nuget help > $null
          nuget restore .\LayoutParserDecrypt.sln

      - name: Build (Release)
        shell: pwsh
        run: |
          msbuild .\LayoutParserDecrypt.sln /m /p:Configuration=Release /p:Platform="Any CPU"

      - name: Upload artifact (exe)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LayoutParserDecrypt
          path: |
            bin\Release\LayoutParserDecrypt.exe
            bin\Release\LayoutParserDecrypt.exe.config
            # Lib está embutida no exe (fontes locais), não gera DLL separada
